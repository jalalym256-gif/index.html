<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ماشین‌حساب قلب</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  /* Layout: plum-dark pocket calculator; win card with a handsome anime gentleman holding a heart, then a yes/no question; final heart-explosion screen; dedication footer pinned on every screen. Single committed dark look. */
  :root{
    --bg:#1c1428; --panel:#2a1f3d; --screen:#150e20; --key:#3b2c55; --key-hi:#4b3a69;
    --accent:#ff5c8a; --accent-d:#e0396b; --gold:#f2c14e; --text:#f6ecff; --muted:#b9a6d4; --danger:#ff8a9c;
    --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0;min-height:100%;
    direction:rtl;font-family:var(--font);
    background:radial-gradient(120% 80% at 50% 0%,#2e2046 0%,var(--bg) 60%);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    padding-block:20px 76px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  .calc{
    width:100%;max-width:340px;direction:ltr;
    background:var(--panel);border-radius:26px;padding:16px;
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .screen{
    background:var(--screen);border-radius:16px;padding:12px 16px;margin-bottom:14px;
    min-height:104px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;overflow:hidden;
  }
  .msg{direction:rtl;align-self:flex-start;font-size:15px;font-weight:600;color:var(--muted);min-height:24px}
  .msg.bad{color:var(--danger)}
  .expr{
    font-size:38px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.5px;
    max-width:100%;overflow-x:auto;white-space:nowrap;scrollbar-width:none;
  }
  .expr::-webkit-scrollbar{display:none}
  .screen.shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .keys button{
    font-family:var(--font);font-size:24px;font-weight:600;color:var(--text);
    background:var(--key);border:0;border-radius:16px;height:58px;cursor:pointer;
    transition:transform .1s, background .15s;touch-action:manipulation;
  }
  .keys button:hover{background:var(--key-hi)}
  .keys button:active{transform:scale(.94)}
  .keys button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .keys .op{background:#573a7d}
  .keys .fn{background:#2f2346;color:var(--muted)}
  .keys .eq{background:var(--accent);grid-row:span 2;height:auto;font-size:30px}
  .keys .eq:hover{background:var(--accent-d)}
  .keys .zero{grid-column:span 2}

  footer{
    position:fixed;left:0;right:0;bottom:0;z-index:30;text-align:center;pointer-events:none;
    padding-top:12px;
    padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px));
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    font-size:16px;font-weight:600;color:#ffc2d4;
    background:linear-gradient(to top,rgba(20,12,30,.9) 55%,transparent);
  }

  /* win screen */
  .win,.boom{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
  }
  .win{
    z-index:20;overflow-y:auto;padding-block:20px 84px;
    background:radial-gradient(100% 70% at 50% 28%,#4a3418 0%,#1a1220 70%);
  }
  .win[hidden],.boom[hidden]{display:none}
  .win-inner{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:380px;width:100%;margin:auto}
  .hero{width:min(58vw,230px);height:auto;flex:none;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 16px 22px rgba(0,0,0,.4))}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .heart{transform-box:fill-box;transform-origin:center;animation:beat 1.2s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .win h1{margin:0;font-size:23px;font-weight:800;line-height:1.8;text-wrap:balance}
  .win h1 span{color:var(--gold)}
  .win h2{margin:4px 0 0;font-size:20px;font-weight:600;color:#ffe2ec}
  .choices{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:64px;--yes:1;--no:1}
  .choices button{font-family:var(--font);font-weight:800;border-radius:999px;cursor:pointer;transition:font-size .3s, padding .3s;touch-action:manipulation;line-height:1.3}
  .choices .yes{
    font-size:calc(20px * var(--yes));padding:calc(9px * var(--yes)) calc(34px * var(--yes));
    background:var(--accent);color:#fff;border:0;box-shadow:0 8px 22px rgba(255,92,138,.45);
  }
  .choices .yes:hover{background:var(--accent-d)}
  .choices .no{
    font-size:calc(18px * var(--no));padding:calc(8px * var(--no)) calc(26px * var(--no));
    background:transparent;color:var(--muted);border:2px solid #7a5aa8;
  }
  .choices button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .warn{margin:0;min-height:28px;font-size:17px;font-weight:600;color:#ffd37a}
  .warn[hidden]{display:block;visibility:hidden}

  /* explosion screen */
  .boom{
    z-index:25;overflow:hidden;flex-direction:column;
    background:radial-gradient(90% 60% at 50% 45%,#5a1f4a 0%,#1a1020 75%);
  }
  #boomC{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .boom-text{
    position:relative;z-index:2;font-size:clamp(32px,10vw,50px);font-weight:800;line-height:1.7;color:#fff;
    text-shadow:0 4px 26px rgba(255,92,138,.8);text-wrap:balance;animation:throb .9s ease-in-out infinite;padding:0 8px;
  }
  @keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #pops{position:absolute;inset:0;pointer-events:none;z-index:3}
  .pop{
    position:absolute;white-space:nowrap;font-weight:800;text-shadow:0 2px 14px rgba(0,0,0,.45);
    animation:pop 1.8s ease-out forwards;
  }
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
    15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
    100%{opacity:0;transform:translate(-50%,-90%) scale(1)}
  }
  .restart{
    position:absolute;z-index:4;bottom:calc(76px + env(safe-area-inset-bottom, 0px));
    font-family:var(--font);font-size:15px;font-weight:600;color:var(--text);
    background:rgba(0,0,0,.25);border:2px solid #b0709a;border-radius:999px;padding:8px 22px;cursor:pointer;
  }
  .restart:hover{background:rgba(0,0,0,.4)}
  .restart:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){.hero,.heart,.screen.shake,.boom-text{animation:none}}
</style>

<script>
/* ====== تنظیمات ====== */
const HINT_AFTER = 8;                          // بعد از چند اشتباه راهنمایی بیاد؛ 0 یعنی هیچ‌وقت
const HINT_TEXT  = "راهنمایی: ۱۴ و ۱۹ رو جمع کن 😉";
/* ===================== */

const exprEl = document.getElementById('expr');
const msgEl  = document.getElementById('msg');
const screen = document.getElementById('screen');
const win    = document.getElementById('win');
const boom   = document.getElementById('boom');
const SYM = {'+':'+','-':'−','*':'×','/':'÷'};
const isOp = s => s in SYM;
const IDLE = 'یه عدد بزن و برابر رو بزن';

let expr = [], tries = 0, locked = false;

function render(){
  exprEl.textContent = expr.length ? expr.map(t => SYM[t] || t).join(' ') : '0';
  exprEl.scrollLeft = exprEl.scrollWidth;
}
function say(text, bad){ msgEl.textContent = text; msgEl.classList.toggle('bad', !!bad); }

function digit(d){
  if(locked) return;
  const last = expr[expr.length-1];
  if(last !== undefined && !isOp(last)){
    if(d === '.' && last.includes('.')) return;
    if(last.length >= 10) return;
    expr[expr.length-1] = (last === '0' && d !== '.') ? d : last + d;
  } else {
    expr.push(d === '.' ? '0.' : d);
  }
  say(IDLE); render();
}
function operator(o){
  if(locked || !expr.length) return;
  if(isOp(expr[expr.length-1])) expr[expr.length-1] = o; else expr.push(o);
  render();
}
function back(){
  if(locked || !expr.length) return;
  const last = expr[expr.length-1];
  if(isOp(last) || last.length <= 1) expr.pop(); else expr[expr.length-1] = last.slice(0,-1);
  render();
}
function clearAll(){ expr = []; render(); }

function equals(){
  if(locked || !expr.length) return;
  const s = expr.join('');
  if(s === '14+19' || s === '19+14') return celebrate();
  wrong();
}
function wrong(){
  locked = true; tries++;
  say('اشتباه شد ❌', true);
  screen.classList.remove('shake'); void screen.offsetWidth; screen.classList.add('shake');
  setTimeout(()=>{
    locked = false; clearAll();
    say(HINT_AFTER && tries >= HINT_AFTER ? HINT_TEXT : IDLE);
  }, 1100);
}

/* ===== سؤال بلی / نخیر ===== */
const choices = document.getElementById('choices');
const warn = document.getElementById('warn');
let noCount = 0;
function applyAsk(){
  choices.style.setProperty('--yes', Math.min(2.6, 1 + 0.24*noCount).toFixed(2));
  choices.style.setProperty('--no',  Math.max(0.4, Math.pow(0.8, noCount)).toFixed(2));
  warn.hidden = noCount <= 3;
}
function celebrate(){
  noCount = 0; applyAsk();
  win.hidden = false;
  win.scrollTop = 0;
}
document.getElementById('no').onclick = ()=>{ noCount++; applyAsk(); };
document.getElementById('yes').onclick = startBoom;

/* ===== انفجار قلب‌ها ===== */
const bc = document.getElementById('boomC'), bx = bc.getContext('2d');
const pops = document.getElementById('pops');
const glyphs = ['❤️','💖','💗','💕','💛','✨'];
const popColors = ['#fff','#ffd37a','#ffb3c9','#ff8fb1','#ffe9a8'];
let bp = [], boomOn = false, burstTimer = 0, popTimer = 0;

function bsize(){ bc.width = innerWidth*devicePixelRatio; bc.height = innerHeight*devicePixelRatio; }
function burst(x,y,n){
  if(bp.length > 700) return;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 3 + Math.random()*10;
    bp.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,s:16+Math.random()*26,
             g:glyphs[Math.random()*glyphs.length|0],a:1,r:(Math.random()-.5)*.2,rot:0});
  }
}
function bloop(){
  if(!boomOn) return;
  bx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  bx.clearRect(0,0,innerWidth,innerHeight);
  bp = bp.filter(p=>p.a>0 && p.y<innerHeight+60);
  for(const p of bp){
    p.x+=p.vx; p.y+=p.vy; p.vx*=.985; p.vy+=.16; p.a-=.007; p.rot+=p.r;
    bx.save(); bx.globalAlpha=Math.max(p.a,0); bx.translate(p.x,p.y); bx.rotate(p.rot);
    bx.font=p.s+'px serif'; bx.textAlign='center'; bx.fillText(p.g,0,0); bx.restore();
  }
  requestAnimationFrame(bloop);
}
function addPop(){
  const d = document.createElement('div');
  d.className = 'pop';
  d.textContent = 'هورااا';
  d.style.left = (10 + Math.random()*80) + '%';
  d.style.top  = (8 + Math.random()*72) + '%';
  d.style.fontSize = (22 + Math.random()*30) + 'px';
  d.style.color = popColors[Math.random()*popColors.length|0];
  pops.appendChild(d);
  setTimeout(()=>d.remove(), 1800);
}
function startBoom(){
  win.hidden = true; boom.hidden = false;
  boomOn = true; bp = []; bsize();
  burst(innerWidth/2, innerHeight/2, 170);
  bloop();
  burstTimer = setInterval(()=>burst(60 + Math.random()*(innerWidth-120), 80 + Math.random()*(innerHeight*.6), 45), 700);
  popTimer = setInterval(addPop, 320);
}
function stopBoom(){
  boomOn = false; clearInterval(burstTimer); clearInterval(popTimer);
  pops.innerHTML = ''; boom.hidden = true;
}
document.getElementById('restart').onclick = ()=>{
  stopBoom(); tries = 0; clearAll(); say(IDLE);
};
addEventListener('resize', ()=>{ if(boomOn) bsize(); });

document.querySelector('.keys').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const k = b.dataset.k;
  if(k === 'C') clearAll();
  else if(k === 'B') back();
  else if(k === '=') equals();
  else if(isOp(k)) operator(k);
  else digit(k);
});
addEventListener('keydown', e=>{
  if(!win.hidden || !boom.hidden) return;
  if(/^[0-9.]$/.test(e.key)) digit(e.key);
  else if(isOp(e.key)) operator(e.key);
  else if(e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
  else if(e.key === 'Backspace') back();
  else if(e.key === 'Escape') clearAll();
});
render();
</script>

</body></html>
